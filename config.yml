# Pathwise settings. Read with load_settings() in R/settings.R.
# Thresholds, CN8 lines, country exceptions and woody taxa live in data/*.csv, not here.

default:
  # EPPO host classes kept for the assessment (fixed, no UI toggle).
  # API v2 labels: Major host, Host, Alternate, Wild/Weed, Experimental,
  # Doubtful host, Non-host. v2 has no "Minor host"; "Host" is used in its place.
  host_classes: [Major host, Host]

  # Use woody_taxa.csv rows without a `reviewed` date (draft list, 2026-10-20:
  # "get things working first"). Set false to count reviewed rows only.
  woody_use_unreviewed: true

  # SSB 08801: table and graph cover this many years back from the latest complete year
  ssb_years: 10
  # ENT3 statistic: volume_stat over the last volume_n complete years
  # (median: trade data are skewed, decided 2026-10-20)
  volume_n: 10
  volume_stat: median

  llm:
    provider: claude        # claude | hf
    model: null             # set in Step 9
    hf_base_url: https://router.huggingface.co/v1

  language: en              # write-up language
  writeup_max_chars: 200    # ENT3 write-up length, to be tested

  cache:
    dir: cache
    # Time to live in days per source. null = never expires.
    ttl_days:
      eppo: 30
      eppo_taxonomy: null
      ssb: 30
      lovdata: 7
      llm: null
